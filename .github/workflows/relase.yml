on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and run contract regressions
        run: ./run-all.sh

      - name: Run split gateway Native AOT smoke
        working-directory: sample
        run: ./test-gateway-aot.sh --split-schemas true

      - name: Run non-split gateway Native AOT smoke
        working-directory: sample
        run: ./test-gateway-aot.sh --split-schemas false

      - name: Zip artifacts
        run: |
          zip ./cli/codegen.cli.zip ./cli/openapi-generator-cli.jar ./cli/yaver-generator-cli.jar

      # - name: Merge jar files
      #   # run: mvn -B package --file pom.xml
      #   run: |
      #     mkdir tmp
      #     (cd tmp; unzip -uoq ../yaver-codegen/target/yaver-codegen.jar)
      #     (cd tmp; unzip -uoq ../cli/openapi-generator-cli.jar)
      #     jar -cvf cli/yaver-generator-cli.jar -C tmp .

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./cli/codegen.cli.zip
    # - name: Publish to GitHub Packages Apache Maven
    #   run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
    #   env:
    #     GITHUB_TOKEN: ${{ github.token }}
