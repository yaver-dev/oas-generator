name: PR validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-aot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and run contract regressions
        run: ./run-all.sh

      - name: Run split gateway Native AOT smoke
        working-directory: sample
        run: ./test-gateway-aot.sh --split-schemas true

      - name: Run non-split gateway Native AOT smoke
        working-directory: sample
        run: ./test-gateway-aot.sh --split-schemas false
